name: Monthly source audit

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:audit
      - name: Create audit pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/source-audit-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(audit): monthly source audit"
          title: "Monthly source audit"
          body: |
            Automated reachability and release-source audit. A successful workflow does not mean all claims remain semantically current; review changed or unreachable sources before merging.
          labels: |
            source-audit
            needs-editorial-review

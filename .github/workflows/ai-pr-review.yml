name: AI — Independent PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  independent-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-generated')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_ENABLE_WEB_SEARCH: "true"
      OPENAI_WEB_SEARCH_TOOL: ${{ vars.OPENAI_WEB_SEARCH_TOOL || 'web_search' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: review
        continue-on-error: true
        run: pnpm ai:review-pr
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-ai-review-${{ github.event.pull_request.number }}
          path: artifacts/ai-pr-review.json
          if-no-files-found: warn
      - if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Independent AI review did not produce a report.';
            if (fs.existsSync('artifacts/ai-pr-review.json')) {
              const report = JSON.parse(fs.readFileSync('artifacts/ai-pr-review.json', 'utf8'));
              body = `## Independent AI review\n\n**Approved:** ${report.approved ? 'yes' : 'no'}\n\n### Reviewer\n${report.reviewer.summary}\n\n### Fact checker\n${report.factChecker.summary}\n\nBlocking issues:\n${[...report.reviewer.blockingIssues, ...report.factChecker.blockingIssues].map(x => `- ${x}`).join('\n') || '- none'}`;
            }
            github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - if: steps.review.outcome == 'failure'
        run: exit 1

name: Optional AI auto-merge

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      vars.ENABLE_AI_AUTOMERGE == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'ai-generated') &&
      contains(github.event.pull_request.labels.*.name, 'ai-approved') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash

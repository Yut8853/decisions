id: ev-authm-oidc-token-validation
title: OpenID Connectでは採用したフローに沿うIDトークン検証が必要
claim: OpenID Connect Coreはアプリに、IDトークンの発行元、対象アプリ、有効期限などを検証させる。署名検証の要否と方法は、トークンを受け取る経路と採用したフローに従う。
sourceType: specification
sourceName: OpenID Foundation
url: https://openid.net/specs/openid-connect-core-1_0.html#IDTokenValidation
primary: true
verificationStatus: verified
verifiedAt: '2026-08-24'
conflictsWith: []
notes: IdPへ本人確認を委ねても、アプリ側には採用したフローに沿うトークン検証とログイン後セッションの保護が残る。

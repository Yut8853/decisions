id: ev-ae-wcag-em-procedure
title: WCAG-EMの評価手順と必要な知識
claim: WCAG-EMは、評価範囲と適合目標の決定、対象の調査、代表サンプルの選択、WCAG適合の評価、結果報告という手順を示し、適切な利用にはWCAG、アクセシブル設計、支援技術などの知識が必要だと説明している。
sourceType: official-documentation
sourceName: W3C Web Accessibility Initiative
url: https://www.w3.org/WAI/test-evaluate/conformance/wcag-em/
primary: true
verificationStatus: verified
verifiedAt: '2026-08-24'
conflictsWith: []
notes: WCAG-EM 2はWCAGへ新しい適合要件を追加するものではなく、評価方法を示すW3C Group Noteとして確認した。

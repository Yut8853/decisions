id: ev-fem-browser-error-events
title: HTML標準は実行時エラーと未処理Promiseを通知する
claim: HTML標準は、実行時スクリプトエラーをglobal error eventとして報告し、未処理のPromise rejectionをunhandledrejectionとして通知する手順を定める。
sourceType: specification
sourceName: WHATWG HTML
url: https://html.spec.whatwg.org/multipage/webappapis.html#runtime-script-errors
primary: true

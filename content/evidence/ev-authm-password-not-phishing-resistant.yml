id: ev-authm-password-not-phishing-resistant
title: パスワードは利用者が選ぶ認証情報でフィッシング耐性を持たない
claim: NIST SP 800-63B-4は、パスワードを利用者が選択または認証側が割り当てる認証情報として扱い、フィッシング耐性のある認証手段とは扱っていない。
sourceType: official-documentation
sourceName: NIST

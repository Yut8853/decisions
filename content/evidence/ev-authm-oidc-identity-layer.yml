id: ev-authm-oidc-identity-layer
title: OpenID Connectは外部の認証結果をアプリへ伝える
claim: OpenID ConnectはOAuth 2.0上の本人確認層で、認証基盤が行った認証に基づき、連携するアプリが利用者の本人性と属性を確認できるようにする。
sourceType: specification
sourceName: OpenID Foundation

id: ev-secc-dependabot-scope
title: Dependabot alertsは依存関係と既知の脆弱性を照合する
claim: Dependabot alertsはGitHubリポジトリの既定ブランチにある依存関係グラフを確認し、GitHub Advisory Databaseの新情報や依存関係変更に応じて警告を作る。
sourceType: official-documentation
sourceName: GitHub
url: https://docs.github.com/en/code-security/concepts/supply-chain-security/dependabot-alerts
primary: true
verificationStatus: verified
verifiedAt: '2026-08-24'
conflictsWith: []
notes: GitHub自身も、すべての脆弱性を検出できるわけではなく、正確なパッケージ定義ファイルとバージョン固定ファイルが必要と説明している。

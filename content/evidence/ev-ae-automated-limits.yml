id: ev-ae-automated-limits
title: 自動評価ツールで確認できる範囲
claim: W3C WAIは、評価ツールが設計・開発中の問題発見と手動確認の支援に使える一方、すべてのアクセシビリティ要件を自動判定できず、人の判断が必要で、ツールだけではアクセシビリティを判定できないと説明している。
sourceType: official-documentation
sourceName: W3C Web Accessibility Initiative
url: https://www.w3.org/WAI/test-evaluate/tools/selecting/
primary: true
verificationStatus: verified
verifiedAt: '2026-08-24'
conflictsWith: []
notes: 自動検査を早期発見と反復確認に用い、最終的な適合判定とは分けて扱う根拠として確認した。

id: ev-authm-oidc-auth-method
title: OpenID Connectの認証結果には認証方法の情報を含められる
claim: OpenID Connect Coreは、認証方法を表すamrを任意のIDトークン情報として定め、パスワードやワンタイムパスワードなど複数の認証方法があり得る例を示している。
sourceType: specification
sourceName: OpenID Foundation
url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
primary: true
verificationStatus: verified
verifiedAt: '2026-08-24'
conflictsWith: []
notes: OpenID Connect連携だけではパスワードレスを保証しないため、選ぶIdPの認証方法とアプリ側で確認できる情報を調べる。

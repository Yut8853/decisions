id: ev-ae-user-involvement
title: 障害のある利用者を含む評価の役割
claim: W3C WAIは、障害のある利用者による評価が適合評価だけでは見つからないユーザビリティ上の問題を見つけ得る一方、少人数の結果は一般化できず、利用者評価だけではアクセシビリティを判定できないためWCAG適合評価と組み合わせるよう説明している。
sourceType: official-documentation
sourceName: W3C Web Accessibility Initiative
url: https://www.w3.org/WAI/test-evaluate/involving-users/
primary: true
verificationStatus: verified
verifiedAt: '2026-08-24'
conflictsWith: []
notes: 利用確認を規格適合評価の代替ではなく補完として扱う根拠を確認した。

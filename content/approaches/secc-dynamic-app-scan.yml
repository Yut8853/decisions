id: secc-dynamic-app-scan
slug: secc-dynamic-app-scan
title: 稼働中アプリを動的検査する（OWASP ZAP）
shortTitle: 稼働中アプリを検査する
summary: 所有者が許可した検証環境へZAPから検査リクエストを送り、実際の応答から問題の候補を調べる方法です。
defaultLabel: specialized
baseScore: 1
technologyIds:
- owasp-zap
concepts:
- dynamic-application-security-testing
- active-scan
- attack-surface
recommendedWhen:
- ログイン、入力画面、APIなど外部から操作できる機能がある
- 所有者から能動検査の許可を得た検証環境を用意できる
- 検出結果と誤検知を判断できる担当者がいる
notRecommendedWhen:
- 攻撃に相当するリクエストを送ってよい検証環境がない
- 対象の状態を初期化できず、データ変更の影響を管理できない
- 依存パッケージの既知の脆弱性だけを継続監視したい
advantages:
- 実際に動くURL、画面遷移、応答を対象にできる
- 能動検査と受動検査の結果を報告できる
- 検出結果を設定により警告、失敗、無視へ分類できる
disadvantages:
- 能動検査は対象へ実際の攻撃に相当する操作を行う
- 認証後の画面や複雑な操作には対象ごとの設定が必要
- すべての画面と業務上の操作を自動で網羅できるとは限らない
resourceIds:
- res-secc-zap-full-scan
- book-frontend-security-intro
lastReviewed: '2026-08-24'

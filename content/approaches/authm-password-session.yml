id: authm-password-session
slug: authm-password-session
title: パスワードとセッションをアプリで管理する
shortTitle: アプリで管理する
summary: パスワードの保存、試行制限、復旧、セッション（ログイン済み状態）をアプリ側で一貫して管理する方法です。
defaultLabel: alternative
baseScore: 1
technologyIds:
- password-authentication
concepts:
- password-hashing
- session-management
- account-recovery
recommendedWhen:
- 外部IdPを利用できず、認証データの保存先を自分たちで管理する
- 既存アプリのパスワード利用者を継続して支える
- 認証と事故対応を継続運用できる担当者がいる
notRecommendedWhen:
- パスワードを使わないことが必須
- 安全な保存、試行制限、復旧、セッション失効を継続運用できない
- 組織の既存アカウントとの共通ログインが必須
advantages:
- 外部IdPの仕様や障害にログイン経路を依存させない
- 認証データの保存先と運用手順を自分たちで決められる
- 既存のパスワード利用者を移行せず継続できる
disadvantages:
- パスワードを平文で保存せず安全にハッシュ化する必要がある
- 不正な試行、漏えい、復旧依頼への対応が必要
- Cookie属性、失効、期限を含むセッション保護が必要
resourceIds:
- res-authm-password-storage
- res-authm-session-management
- book-frontend-security-intro
lastReviewed: '2026-08-24'

id: managed-container-runtime
slug: managed-container-runtime
title: マネージドコンテナ実行環境
shortTitle: マネージドコンテナ
summary: アプリと依存物をコンテナイメージにまとめ、サービス、ジョブ、常駐ワーカーとして実行する構成です。
defaultLabel: specialized
baseScore: 1
technologyIds:
- containers
- managed-container-platform
concepts:
- container-image
- service
- job
- worker
recommendedWhen:
- 実行基盤のコンテナ仕様を満たす範囲で、OSパッケージや独自バイナリを含む実行環境が必要
- HTTP以外の常駐ワーカーや完了まで動くジョブが必要
- 同じコンテナイメージを複数環境で扱いたい
notRecommendedWhen:
- 静的ファイルの配信だけで要件を満たせる
- コンテナイメージの更新と脆弱性対応を担当できない
advantages:
- ランタイムとシステム依存物をイメージへ含められる
- Webサービス、完了型ジョブ、常駐ワーカーを分けて設計できる
disadvantages:
- イメージ作成、更新、起動、状態の外部化を設計する必要がある
- 対応OS、CPUアーキテクチャ、起動方法など実行基盤のコンテナ仕様に従う必要がある
- 静的配信や単純な関数より管理対象が増える
resourceIds:
- res-host-cloud-run-overview
- res-host-cloud-run-container-contract
lastReviewed: '2026-08-24'

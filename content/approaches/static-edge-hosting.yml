id: static-edge-hosting
slug: static-edge-hosting
title: 静的生成 + エッジ配信
shortTitle: 静的・エッジ配信
summary: 公開時にHTML・CSS・JavaScriptを生成し、静的ファイルとしてCDNやエッジから配信する構成です。
defaultLabel: canonical
baseScore: 3
technologyIds:
- static-site-generation
- cdn
- edge-hosting
concepts:
- static-export
- edge-delivery
- build-time-rendering
recommendedWhen:
- 閲覧者によらず同じ内容を配信できる
- 公開時のビルドでページ内容を確定できる
- 閲覧時にアプリのサーバープロセスを動かしたくない
notRecommendedWhen:
- 認証やCookieなど、リクエストごとの情報で応答を変える
- サーバー側でデータを更新する処理が必要
advantages:
- HTML・CSS・JavaScriptを配信できるWebサーバーを選べる
- 閲覧時のアプリ実行環境を持たない構成にできる
disadvantages:
- サーバー機能を必要とする処理は別の実行環境へ分離する必要がある
- 内容の反映にビルドと配信を伴う

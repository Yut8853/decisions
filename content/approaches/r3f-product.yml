id: r3f-product
slug: r3f-product
title: React Three FiberによるReact統合型ビューア
shortTitle: R3F + Three.js
summary: Reactの宣言的な構成と状態管理の中にThree.jsシーンを組み込む方法です。
defaultLabel: alternative
baseScore: 1
technologyIds:
- react
- r3f
- threejs
concepts:
- react-reconciliation
- scene
- state-management
recommendedWhen:
- 既存Reactアプリで3DとUI状態を連携する
- チームがReactに習熟している
notRecommendedWhen:
- Reactを使用していない
- 単純表示だけで依存を増やしたくない
advantages:
- Reactコンポーネントとして管理できる
- Dreiなど周辺機能を利用できる
disadvantages:
- ReactとThree.js双方の理解が必要
- 抽象化の挙動を理解せず最適化すると難しい
learningPath:
- resourceId: res-r3f-intro
  stage: start
  reason: R3FのコードがThree.jsのどの機能に対応しているかを、まず公式の導入ガイドで確認します。
- resourceId: book-react-design
  stage: start
  reason: R3FはReactのコンポーネントと状態管理の上で動くため、Reactに慣れていない場合はこの本から始めます。
- resourceId: course-threejs-journey
  stage: start
  reason: Three.jsの基礎から始めて、後半の章でReact Three Fiberを扱う動画講座です（英語）。
- resourceId: res-r3f-performance
  stage: stuck
  reason: 表示が重くなったときに、再描画の抑え方や同じモデルの使い回しなど、R3F特有の対処を確認します。
- resourceId: book-learn-threejs-4e
  stage: deepen
  reason: R3Fの下で動いているThree.jsそのものを理解したくなったときに読みます。ReactやTypeScriptとの組み合わせも扱っています（英語）。
lastReviewed: '2026-08-23'

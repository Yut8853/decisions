id: ftp-browser-component-tests
slug: ftp-browser-component-tests
title: ブラウザ内のコンポーネントテストから整備する
shortTitle: ブラウザ内コンポーネントテスト
summary: ボタンやフォームなどのUIを個別に表示し、実ブラウザで操作、表示更新、フォーカスを確認する方法です。
defaultLabel: alternative
baseScore: 2
technologyIds:
- vitest-browser-mode
concepts:
- component-testing
- browser-testing
recommendedWhen:
- UI部品の状態や操作が品質上の中心
- 実際のDOM、CSS、イベント、フォーカスを確認したい
- アプリ全体より小さな範囲で画面の原因を調べたい
notRecommendedWhen:
- ログインから完了まで複数画面をまたぐ導線を保証したい
- 画面から分離した計算ロジックの境界値が主要なリスク
advantages:
- 実ブラウザのDOMとBrowser APIを使ってUIを検証できる
- アプリ全体より小さな範囲で失敗原因を追いやすい
disadvantages:
- ブラウザの準備とテスト用の表示環境が必要になる
- コンポーネントの外にある画面遷移やバックエンド連携は別途確認が必要
resourceIds:
- res-ftp-vitest-browser-components
- book-frontend-testing-intro
lastReviewed: '2026-08-24'

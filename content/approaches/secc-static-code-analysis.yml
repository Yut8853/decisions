id: secc-static-code-analysis
slug: secc-static-code-analysis
title: ソースコードを静的解析する（CodeQL）
shortTitle: コードを静的解析する
summary: CodeQLでソースコードから解析用データを作り、クエリ（検査ルール）を実行して問題の候補を見つける方法です。
defaultLabel: canonical
baseScore: 2
technologyIds:
- codeql
concepts:
- static-analysis
- code-scanning
- data-flow-analysis
recommendedWhen:
- 独自コードの入力処理やデータの流れを継続して確認したい
- 対象言語がCodeQLの対応範囲に入っている
- リポジトリ種別と解析用途に対するCodeQLの利用条件を確認している
- 変更ごとに解析を実行する環境がある
notRecommendedWhen:
- 対象言語や利用するフレームワークが解析対象として扱えない
- 公開リポジトリ向けの条件、または非公開コードと自動解析に必要な契約・利用許可を満たせない
- 実際に動く設定、認証状態、外部サービスとの接続だけを調べたい
- 検出結果を確認して修正へつなぐ担当者を置けない
advantages:
- アプリを外部公開する前にソースコードを調べられる
- 変更ごとの自動解析へ組み込みやすい
- 問題につながるデータの流れをクエリで調べられる
disadvantages:
- 対応言語とモデル化されたフレームワークに範囲が限られる
- 実行環境だけで起きる問題は直接確認できない
- 警告の優先順位と誤検知を人が判断する必要がある
resourceIds:
- res-secc-codeql-scanning
- res-secc-codeql-cli-terms
- book-frontend-security-intro
lastReviewed: '2026-08-24'

id: hosted-search-service
slug: hosted-search-service
title: 検索専用サービスを利用する（Algolia）
shortTitle: 検索専用サービス
summary: 検索対象を外部の索引へ登録し、検索APIと検索品質の調整機能を利用する方法です。
defaultLabel: alternative
baseScore: 2
technologyIds:
- algolia
- search-api
concepts:
- hosted-search
- search-relevance
- index-synchronization
recommendedWhen:
- コンテンツ更新を公開作業と分けて検索へ反映したい
- 同義語、絞り込み、検索ルール、独自の並び順を調整したい
- 検索基盤の運用を外部サービスへ任せられる
notRecommendedWhen:
- 検索対象を外部のクラウドサービスへ送信できない
- 更新頻度が低く基本的な全文検索だけで足りる
- 利用量、契約、障害時の代替手段を管理できない
advantages:
- 検索索引のレコードをAPIで追加・更新できる
- 同義語や検索ルールなどの調整機能を利用できる
- 検索基盤そのものを自前で保守しなくてよい
disadvantages:
- 利用料、契約条件、利用上限を継続して確認する必要がある
- 元データと外部索引の同期処理が必要
- Algoliaの標準タイプミス許容は日本語の表語文字検索には適用されないため、別の調整が必要
resourceIds:
- res-algolia-search-api
- res-algolia-relevance
- res-algolia-natural-languages
- book-relevant-search
lastReviewed: '2026-08-24'

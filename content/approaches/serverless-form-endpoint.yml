id: serverless-form-endpoint
slug: serverless-form-endpoint
title: サーバーレス関数で受付窓口を作る
shortTitle: サーバーレス受付窓口
summary: APIの一つの受付経路と関数を用意し、入力検証、送信制限、通知処理を必要な範囲で実装する方法です。
defaultLabel: canonical
baseScore: 2
technologyIds:
- aws-lambda
- api-gateway
concepts:
- serverless-endpoint
- server-side-validation
- request-throttling
recommendedWhen:
- 受付サービスでは足りない独自処理が少しだけ必要
- フル構成のバックエンドを新設したくない
- 関数、通知先、失敗時の再処理を運用できる
notRecommendedWhen:
- 複数段階の承認や多数の業務システム連携が必要
- 実行基盤の設定や監視を担当できない
- 既存バックエンドに同じ入力検証と業務処理がすでにある
advantages:
- 問い合わせ専用の小さな受付処理として分離できる
- 入力検証と通知先を要件に合わせて実装できる
- API経路ごとの送信制限を設定できる構成を選べる
disadvantages:
- 入力検証、迷惑送信対策、通知失敗への対応は自分たちの責任
- 実行基盤と通知サービスの権限、ログ、上限を管理する
- 処理が増えると分散した関数の追跡が難しくなる
resourceIds:

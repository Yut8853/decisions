id: wvm-public-crux
slug: wvm-public-crux
title: 公開された実利用データを見る（CrUX）
shortTitle: 公開実測データを見る
summary: CrUX（Chrome UX Report）が集計した公開URLの実利用データから、表示品質の傾向を見る方法です。
defaultLabel: fast
baseScore: 3
technologyIds:
- crux
concepts:
- field-data
- core-web-vitals
- aggregate-measurement
recommendedWhen:
- 公開URLにCrUXで確認できるだけの利用実績がある
- 個別利用者ではなく、集計された実測の傾向を知りたい
- 計測コードと収集基盤を追加せずに始めたい
notRecommendedWhen:
- 公開したばかりで対象URLの実測データが利用できない
- 個別の画面表示や端末条件を詳しく調べたい
- Googleの公開データやAPIを利用できない
advantages:
- 自サイトへ計測コードを追加せず実利用データを確認できる
- URLまたはサイト単位の集計結果を取得できる
- 実際の利用環境を含む表示品質の傾向を見られる
disadvantages:
- すべてのサイトやURLにデータがあるわけではない
- 集計データのため個別の利用状況は追えない
- 自分で送信項目や集計期間を変更できない
resourceIds:
- res-wvm-crux-overview
- book-web-performance-engineering-ai
lastReviewed: '2026-08-24'

id: kqa-curated-faq-search
slug: kqa-curated-faq-search
title: 承認済みFAQを検索して表示する
shortTitle: 固定FAQ検索
summary: 質問を検索し、編集者が承認して公開した回答へ案内する、生成AIを使わない方法です。
defaultLabel: canonical
baseScore: 3
technologyIds:
- pagefind
- static-site
concepts:
- curated-knowledge-base
- static-search-index
recommendedWhen:
- 同じ質問には承認済みの同じ内容を返したい
- 質問の種類と回答範囲を編集者が管理できる
- 外部の生成AIサービスへ資料を送れない
notRecommendedWhen:
- 多数の長い資料を横断して新しい文章で回答したい
- 資料の更新を公開作業なしですぐ検索へ反映したい
advantages:
- 生成による表現の揺れや推測を回答経路から外せる
- 回答本文を通常の公開コンテンツとして確認できる
disadvantages:
- 想定質問と回答を人が用意して更新する必要がある
- FAQにない質問へ柔軟な文章で回答できない
resourceIds:
- res-kqa-pagefind-docs
lastReviewed: '2026-08-24'

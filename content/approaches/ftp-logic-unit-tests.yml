id: ftp-logic-unit-tests
slug: ftp-logic-unit-tests
title: ロジックの単体テストから整備する
shortTitle: ロジック単体テスト
summary: 計算、変換、状態遷移など、画面から分けられる処理を小さな単位で直接確認する方法です。
defaultLabel: canonical
baseScore: 3
technologyIds:
- vitest
concepts:
- unit-testing
- dependency-isolation
recommendedWhen:
- 分岐や計算、データ変換の誤りが主要なリスク
- 外部依存を分けて入力と出力を詳しく確認したい
- 画面を起動せずに検証できる処理が多い
notRecommendedWhen:
- 実際のDOM、CSS、フォーカス、ブラウザAPIの挙動が主要なリスク
- 複数画面をまたぐ利用導線の成立を直接確かめたい
advantages:
- 内部ロジックの境界値を直接検証できる
- 依存関係を分離して失敗箇所を絞りやすい
disadvantages:
- 既定のNode.js環境では実ブラウザの挙動を確認できない
- 単体で正しくても画面やサービスをつないだ導線は保証しない
resourceIds:
- res-ftp-vitest-environment
lastReviewed: '2026-08-24'

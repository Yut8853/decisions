id: ae-manual-conformance-review
slug: ae-manual-conformance-review
title: 専門家が規格に沿って手動評価する
shortTitle: 手動の規格適合評価
summary: 評価範囲と代表ページを定め、専門知識を持つ確認者がWCAGへの適合状況を調べて報告する方法です。
defaultLabel: canonical
baseScore: 2
technologyIds:
- wcag-em
- wcag
concepts:
- conformance-evaluation
- expert-review
recommendedWhen:
- 規格に沿った評価範囲と結果を説明したい
- WCAGと支援技術を理解した確認者を確保できる
- 自動検査で判定できない項目も確認したい
notRecommendedWhen:
- 専門知識を持つ確認者を確保できない
- 実際の利用者のつまずきを規格評価だけで把握したい
advantages:
- 評価範囲、代表ページ、適合目標を明示して進められる
- 自動化できない項目を人が判断できる
disadvantages:
- WCAGや支援技術を理解した評価者が必要になる
- 規格への適合確認だけでは実利用上の課題を拾い切れない
resourceIds:
- res-ae-wcag-em
lastReviewed: '2026-08-24'

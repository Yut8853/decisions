id: fem-managed-error-service
slug: fem-managed-error-service
title: 管理型エラー監視を使う（Sentryなど）
shortTitle: 管理型監視を使う
summary: SDK（ブラウザへ組み込む収集用ライブラリ）でエラーを管理サービスへ送り、検索、まとめ表示、通知を行う方法です。
defaultLabel: fast
baseScore: 3
technologyIds:
- sentry
concepts:
- managed-error-monitoring
- browser-sdk
- error-alerting
recommendedWhen:
- 公開後の画面エラーを短期間で収集し始めたい
- エラーの一覧、まとめ表示、通知を自前で作りたくない
- 送信先のデータ処理条件を確認して利用できる
notRecommendedWhen:
- エラー情報を外部サービスへ送信できない
- 保存場所と保持方法を自分たちの基盤だけに限定する
- SDKが収集する項目を確認して不要情報を除外できない
advantages:
- ブラウザSDKと管理画面から早く始められる
- 似たエラーのまとめ表示、発生状況、条件に応じた通知を一つのサービスで扱える
- ソースマップを使って圧縮前の位置を確認できる
disadvantages:
- 外部サービスの契約、保存先、利用条件に依存する
- 送信前に個人情報や認証情報を除外する設定が必要
- ソースマップの公開範囲とアップロード方法を管理する必要がある
resourceIds:
- res-fem-sentry-javascript
- res-fem-sentry-sourcemaps
- res-fem-sentry-alerts
lastReviewed: '2026-08-24'

id: ftp-critical-flow-e2e
slug: ftp-critical-flow-e2e
title: 主要な利用導線のE2Eテストから整備する
shortTitle: 主要導線E2E
summary: 利用者と同じ見える操作で、ログイン、申し込み、購入など重要な一連の流れをブラウザから確認する方法です。
defaultLabel: specialized
baseScore: 1
technologyIds:
- playwright
concepts:
- end-to-end-testing
- critical-user-journey
recommendedWhen:
- 複数画面や複数の仕組みをまたぐ重要な導線がある
- 利用者が見て操作する結果をブラウザで確認したい
- 複数のブラウザで主要機能を確認したい
notRecommendedWhen:
- 内部関数の多数の境界値を主に検証したい
- 制御できない外部サービスを毎回直接呼ぶテストにしたい
advantages:
- 画面から連携先までを通した主要導線を確認できる
- Chromium、WebKit、Firefoxを対象にできる
disadvantages:
- ブラウザ、テストデータ、認証状態などの環境整備が必要になる
- 細かな内部ロジックの網羅には別のテスト層が必要になる
resourceIds:
- res-ftp-playwright-best-practices
lastReviewed: '2026-08-24'

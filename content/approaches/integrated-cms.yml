id: integrated-cms
slug: integrated-cms
title: 表示統合型CMS
shortTitle: 表示統合型CMS
summary: コンテンツ編集、テンプレート、公開画面を一つのCMSで管理し、CMSがページを生成する構成です。
defaultLabel: fast
baseScore: 2
technologyIds:
- integrated-cms
- wordpress
concepts:
- visual-editing
- template-rendering
- direct-publishing
recommendedWhen:
- WordPressのBlock themeなど、編集画面でページを見ながら内容やブロックを変更できる構成を採用する
- 一つのWebサイトをCMSから直接公開する
- 編集権限と公開状態をCMS内で管理する
notRecommendedWhen:
- 同じ構造化コンテンツを複数の独立した表示先で使うことが中心
- 表示側とCMSを別々の技術や公開周期で運用したい
advantages:
- 対応するテーマと編集機能を使えば、編集画面、公開状態、テンプレートを一つの管理画面にまとめられる
- コンテンツ変更をフロントエンドの静的ビルドと切り離せる
disadvantages:
- CMS本体、テーマ、拡張機能の更新を一体で管理する必要がある
- 表示を別アプリへ移す場合はデータとテンプレートの分離が必要
resourceIds:
- res-cms-wordpress-site-editor
- res-cms-wordpress-templates
- book-software-architecture-fundamentals-2e-ja
lastReviewed: '2026-08-24'

id: build-time-static-search
slug: build-time-static-search
title: 公開時に検索索引を作る（Pagefind）
shortTitle: 公開時に索引を作る
summary: サイトの公開用HTMLから検索索引を生成し、ブラウザだけで検索を完結させる方法です。
defaultLabel: canonical
baseScore: 3
technologyIds:
- pagefind
- static-site
concepts:
- static-search-index
- client-side-search
- build-pipeline
recommendedWhen:
- コンテンツ更新時にサイトを再生成できる
- 検索用のサーバーや外部サービスを増やしたくない
- 小規模チームで基本的な絞り込みや並び替えを提供したい
notRecommendedWhen:
- 公開作業を待たずに検索結果へ更新を反映したい
- 同義語や業務ルールを使った検索順位の継続調整が主要要件
- ログイン利用者ごとに検索対象を厳密に変える
advantages:
- 検索専用のサーバーを運用せずに導入できる
- 生成済みHTMLを索引の原本にできる
- 用意された検索画面から小さく始められる
disadvantages:
- コンテンツ更新後に索引の再生成と再公開が必要
- 必要な同義語、検索ルール、業務上の並び順が設定やAPIの範囲に収まるか確認が必要
- 日本語の固有名詞や表記揺れは実データで確認が必要
resourceIds:
- res-pagefind-search-docs
- res-pagefind-multilingual
lastReviewed: '2026-08-24'

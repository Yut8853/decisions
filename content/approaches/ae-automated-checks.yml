id: ae-automated-checks
slug: ae-automated-checks
title: 公開前にアクセシビリティを自動検査する
shortTitle: 自動検査
summary: ページを機械的に検査し、判定できる問題を開発中や公開前に繰り返し見つける方法です。
defaultLabel: fast
baseScore: 3
technologyIds:
- accessibility-evaluation-tools
concepts:
- automated-accessibility-testing
- continuous-quality-check
recommendedWhen:
- 公開処理のたびに同じ検査を繰り返したい
- まず明確な実装ミスを早く見つけたい
- 少人数で継続できる確認方法から始めたい
notRecommendedWhen:
- 自動検査の結果だけでアクセシビリティ全体の合否を決めたい
- 支援技術を使った実際の操作のしやすさを確かめたい
advantages:
- 開発中と公開前に同じ条件で繰り返せる
- 機械で判定できる問題を早い段階で見つけられる
disadvantages:
- 人の判断が必要な問題は検査だけでは確定できない
- 誤検出や見落としを担当者が確認する必要がある
resourceIds:
- res-ae-wai-evaluation-tools
lastReviewed: '2026-08-24'

id: ae-inclusive-usability-review
slug: ae-inclusive-usability-review
title: 障害のある利用者と操作を確認する
shortTitle: 当事者を含む利用確認
summary: 障害のある利用者を含む参加者に実際の操作を試してもらい、規格評価だけでは分からないつまずきを見つける方法です。
defaultLabel: specialized
baseScore: 1
technologyIds:
- inclusive-user-research
concepts:
- usability-evaluation
- assistive-technology
recommendedWhen:
- 実際の作業を完了できるか確かめたい
- 支援技術や異なる操作方法でのつまずきを知りたい
- 利用者へ参加を依頼できる体制がある
notRecommendedWhen:
- 少人数の所見だけを全利用者へ一般化したい
- 利用確認だけでWCAGへの適合を判定したい
advantages:
- 実際の操作で起きる分かりにくさを把握できる
- 規格評価だけでは見つからない利用上の課題を得られる
disadvantages:
- 参加者の募集、配慮、同意、日程調整が必要になる
- 参加者の結果だけでアクセシビリティ全体は判定できない
resourceIds:
- res-ae-wai-involving-users
- book-web-inclusive-design
- book-web-accessibility-textbook
lastReviewed: '2026-08-24'

id: kqa-custom-retrieval-ai
slug: kqa-custom-retrieval-ai
title: 自前の検索と生成AIを組み合わせる
shortTitle: 自前検索＋生成AI
summary: 検索索引、権限判定、検索順を自分たちで管理し、取得した資料だけを選んだ生成モデルへ渡す方法です。
defaultLabel: specialized
baseScore: 1
technologyIds:
- postgresql
- pgvector
concepts:
- custom-retrieval
- retrieval-augmented-generation
recommendedWhen:
- 部門、期間、権限で検索対象を細かく変えたい
- 検索方式や順位、回答前後の処理を自分たちで制御したい
- 検索基盤と生成モデルを分けて選びたい
notRecommendedWhen:
- 検索索引、権限、評価、監視を担当する体制がない
- 少数の固定FAQだけで目的を満たせる
- 取得した資料を渡す生成モデルの送信先、保存、削除条件を確認できない
advantages:
- キーワード検索、ベクトル検索、業務条件を組み合わせられる
- 検索対象への権限判定を自分たちのデータ設計へ組み込める
disadvantages:
- 索引更新、検索品質、権限、生成回答の評価を自分たちで運用する
- 構成要素が増え、障害箇所と保守範囲が広がる
- 検索側の権限とは別に、生成モデル側のデータ取扱条件を確認する必要がある
resourceIds:
- res-kqa-pgvector
- res-kqa-postgresql-row-security
lastReviewed: '2026-08-24'

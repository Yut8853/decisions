id: git-based-content
slug: git-based-content
title: Git管理コンテンツ + 静的ビルド
shortTitle: Git管理
summary: MarkdownやYAMLなどのコンテンツをコードと同じGitリポジトリで管理し、承認後にサイトをビルドする構成です。
defaultLabel: alternative
baseScore: 2
technologyIds:
- git
- static-site-generation
- decap-cms
concepts:
- version-control
- pull-request
- build-pipeline
recommendedWhen:
- コンテンツ変更も差分レビューとテストを通したい
- コードと内容を同じ版で再現したい
- 更新頻度より公開前の確認を優先する
notRecommendedWhen:
- フロントエンドを再ビルドせずに内容を反映したい
- 編集者がページレイアウトを自由に組み替える必要がある
advantages:
- コンテンツの差分と履歴をGitで確認できる
- Pull Requestで差分へのコメント、承認、変更要求を記録できる
disadvantages:
- 公開までにコミット、承認、ビルド、配信の工程が入る
- 編集UIやプレビューは別途設定が必要
resourceIds:

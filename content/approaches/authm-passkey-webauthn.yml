id: authm-passkey-webauthn
slug: authm-passkey-webauthn
title: パスキーをアプリに直接組み込む
shortTitle: パスキーを組み込む
summary: WebAuthn（ブラウザと端末の本人確認をつなぐ標準）を使い、公開鍵の資格情報を登録してパスワードなしでログインする方法です。
defaultLabel: specialized
baseScore: 2
technologyIds:
- webauthn
concepts:
- passkey
- public-key-authentication
- account-recovery
recommendedWhen:
- パスワードを作成・入力しない体験を優先する
- 対応端末を試し、登録、追加、削除、復旧まで設計できる
- 認証を継続して運用できる担当者がいる
notRecommendedWhen:
- 組織の既存IdPによる共通ログインが必須
- 端末紛失時の復旧や予備のログイン手段を設計できない
- 対象利用者のブラウザと端末で事前検証できない
advantages:
- 利用者がパスワードを記憶して入力する必要をなくせる
- 資格情報がWebサイトの範囲に結び付く
- パスワードの共有や使い回しを前提にしない
disadvantages:
- 登録、認証、ログイン手段の追加と削除をアプリ側で実装する
- 端末変更や紛失に備えた復旧手順が別に必要
- 利用者の端末環境による違いを試す必要がある
resourceIds:
- res-authm-webauthn-level3
- res-authm-nist-authenticators
lastReviewed: '2026-08-24'

- id: react-existing
  label: Reactを利用
  description: 既存プロジェクトがReactで構成されている。
  category: environment
  conflictsWith: []
- id: ar-required
  label: ARが必要
  description: 端末のAR表示へつなぐ導線が要件に含まれる。
  category: requirement
  conflictsWith: []
- id: mobile-priority
  label: モバイル重視
  description: スマートフォンでの表示品質と操作性を優先する。
  category: priority
  conflictsWith: []
- id: short-deadline
  label: 短納期
  description: 実装と検証に使える期間が短い。
  category: priority
  conflictsWith:
    - advanced-visuals
- id: advanced-visuals
  label: 高度な独自表現
  description: 既成機能では足りないシェーダーや独自インタラクションが必要。
  category: requirement
  conflictsWith:
    - short-deadline
    - simple-display
- id: maintainability-priority
  label: 保守性重視
  description: 長期運用、引き継ぎ、変更容易性を優先する。
  category: priority
  conflictsWith: []
- id: existing-glsl-assets
  label: 既存GLSL資産あり
  description: 再利用したいGLSLシェーダーやWebGL資産が存在する。
  category: asset
  conflictsWith: []
- id: small-team
  label: 少人数チーム
  description: 専任担当者を多く置けず、設計・実装・運用を少人数で分担する。
  category: team
  conflictsWith: []
- id: performance-priority
  label: 性能重視
  description: 描画性能、初期表示、実行負荷を優先して判断する。
  category: priority
  conflictsWith: []
- id: simple-display
  label: 単純表示が中心
  description: 回転・拡大など基本操作が中心で、独自演出は少ない。
  category: requirement
  conflictsWith:
    - advanced-visuals

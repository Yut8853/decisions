- id: react-existing
  label: Reactを利用
  description: 既存プロジェクトがReactで構成されている。
  category: environment
  conflictsWith: []
- id: ar-required
  label: ARが必要
  description: 端末のAR表示へつなぐ導線が要件に含まれる。
  category: requirement
  conflictsWith: []
- id: mobile-priority
  label: モバイル重視
  description: スマートフォンでの表示品質と操作性を優先する。
  category: priority
  conflictsWith: []
- id: seo-priority
  label: SEO重視
  description: 検索エンジンが理解できるHTML本文と導線を重要視する。
  category: priority
  conflictsWith: []
- id: short-deadline
  label: 短納期
  description: 実装と検証に使える期間が短い。
  category: priority
  conflictsWith:
  - advanced-visuals
- id: advanced-visuals
  label: 高度な独自表現
  description: 既成機能では足りないシェーダーや独自インタラクションが必要。
  category: requirement
  conflictsWith:
  - short-deadline
  - simple-display
- id: maintainability-priority
  label: 保守性重視
  description: 長期運用、引き継ぎ、変更容易性を優先する。
  category: priority
  conflictsWith: []
- id: existing-glsl-assets
  label: 既存GLSL資産あり
  description: 再利用したいGLSLシェーダーやWebGL資産が存在する。
  category: asset
  conflictsWith: []
- id: small-team
  label: 少人数チーム
  description: 専任3Dエンジニアを置かない小規模チームで開発する。
  category: team
  conflictsWith: []
- id: performance-priority
  label: 性能重視
  description: 描画性能、初期表示、実行負荷を優先して判断する。
  category: priority
  conflictsWith: []
- id: accessibility-priority
  label: アクセシビリティ重視
  description: 代替コンテンツ、キーボード操作、読み上げ対応を優先する。
  category: priority
  conflictsWith: []
- id: content-heavy
  label: 情報量が多い
  description: 本文、商品情報、採用情報などHTMLコンテンツが多い。
  category: requirement
  conflictsWith: []
- id: large-object-count
  label: 大量オブジェクト
  description: 数百〜数万規模の描画対象を扱う。
  category: requirement
  conflictsWith: []
- id: low-end-devices
  label: 低性能端末も対象
  description: GPU性能やメモリが限られる端末を利用対象に含める。
  category: environment
  conflictsWith: []
- id: dynamic-objects
  label: オブジェクトが動的
  description: 個々のオブジェクトが頻繁に移動・更新される。
  category: requirement
  conflictsWith:
  - static-scene
- id: static-scene
  label: 静的シーン
  description: 配置や形状がほとんど変化しない。
  category: requirement
  conflictsWith:
  - dynamic-objects
- id: repeated-geometry
  label: 同じ形状を反復
  description: 同一GeometryやMaterialを持つオブジェクトを多数描画する。
  category: requirement
  conflictsWith: []
- id: varying-detail
  label: 距離で詳細度を変更
  description: カメラ距離に応じてモデルの詳細度を切り替えられる。
  category: requirement
  conflictsWith: []
- id: simple-display
  label: 単純表示が中心
  description: 回転・拡大など基本操作が中心で、独自演出は少ない。
  category: requirement
  conflictsWith:
  - advanced-visuals
- id: frequent-content-updates
  label: 更新頻度が高い
  description: コンテンツの追加や変更が頻繁に発生し、検索結果へ早く反映する必要がある。
  category: requirement
  conflictsWith:
  - infrequent-content-updates
- id: infrequent-content-updates
  label: 更新頻度が低い
  description: コンテンツ更新は少なく、更新時にサイト全体を再生成しても支障が少ない。
  category: requirement
  conflictsWith:
  - frequent-content-updates
- id: existing-postgresql-database
  label: 既存のPostgreSQLあり
  description: 検索対象データを保持するPostgreSQLデータベースをすでに運用している。
  category: environment
  conflictsWith: []
- id: advanced-search-relevance
  label: 継続的な検索調整が必要
  description: サイトの再公開とは別に、同義語、業務ルール、独自の並び順などを継続して調整する必要がある。
  category: requirement
  conflictsWith: []
- id: personal-data-form
  label: 個人情報を受け取る
  description: 問い合わせで氏名、連絡先など、取り扱い方針が必要な個人情報を受け取る。
  category: requirement
  conflictsWith: []
- id: confidential-form-data
  label: 業務上の機密情報を受け取る
  description: 問い合わせで未公開情報や契約上保護すべき業務データを受け取る。
  category: requirement
  conflictsWith: []
- id: complex-form-workflow
  label: 送信後の業務処理が複雑
  description: 受付後にデータ保存、権限判定、複数システム連携などの処理が必要。
  category: requirement
  conflictsWith: []
- id: existing-application-backend
  label: 既存バックエンドあり
  description: 入力検証やデータ保存を担当できる既存のアプリケーションサーバーがある。
  category: environment
  conflictsWith: []
- id: external-service-restricted
  label: 外部サービス利用を制限
  description: 契約、データ管理、セキュリティ方針により外部SaaSへの送信を避ける必要がある。
  category: requirement
  conflictsWith: []
- id: static-output-possible
  label: 静的出力で成立
  description: 公開時にHTML・CSS・JavaScriptを生成でき、閲覧時のサーバー処理を必須としない。
  category: requirement
  conflictsWith:
  - request-time-processing-required
- id: request-time-processing-required
  label: 閲覧時のサーバー処理が必要
  description: 認証、個別表示、データ更新など、リクエストごとのサーバー処理が必要。
  category: requirement
  conflictsWith:
  - static-output-possible
- id: bursty-traffic
  label: アクセス変動が大きい
  description: アクセスが少ない時間と急増する時間の差が大きい。
  category: environment
  conflictsWith: []
- id: persistent-worker-required
  label: 常駐処理が必要
  description: キューの監視など、HTTPリクエストの外で継続して動く処理が必要。
  category: requirement
  conflictsWith: []
- id: custom-runtime-required
  label: 実行環境を細かく指定
  description: OSパッケージ、バイナリ、言語ランタイムなどをアプリ側で指定する必要がある。
  category: requirement
  conflictsWith: []
- id: content-code-review-required
  label: 更新もコードレビュー
  description: コンテンツ変更も差分確認と承認を経て公開したい。
  category: priority
  conflictsWith: []
- id: multi-channel-delivery-required
  label: 複数チャネルへ配信
  description: 同じコンテンツをWebサイト、アプリなど複数の表示先で再利用する。
  category: requirement
  conflictsWith: []
- id: structured-content-required
  label: 構造化コンテンツ重視
  description: 定義した項目や型に沿って入力し、コンテンツを再利用・検証したい。
  category: requirement
  conflictsWith: []
- id: cms-layout-editing-required
  label: CMS内でページ構成を編集
  description: CMSのテンプレートやブロックを使い、本文だけでなくページ構成も直接編集したい。
  category: requirement
  conflictsWith: []
- id: cms-direct-publishing-required
  label: CMSからページを直接公開
  description: 別のフロントエンドをビルド・配信せず、CMSのテンプレートから公開ページへ反映したい。
  category: requirement
  conflictsWith: []
